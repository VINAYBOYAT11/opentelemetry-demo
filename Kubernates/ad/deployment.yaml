apiVersion: apps/v1
Kind: Deployment
metadata:
#human-readable name for the deployment
  name: opentelemetry-adservice
  labels:
    opentelemetry.io/name: opentelemetry-adservice
    app.kubernetes.io/component: adservice
    app.kubernetes.io/name: opentelemetry-adservice
#specifies the desired state of the deployment layer
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      #important: The label selector must match the labels defined in the pod template.
      opentelemetry.io/name: opentelemetry-adservice
  #specifies the template for the pods
  template:
    metadata:
      labels:
        opentelemetry.io/name: opentelemetry-adservice
    spec:
      serviceAccountName: opentelemetry-demo
      containers:
      - name: ad-container
        image: public.ecr.aws/f6a5u4d3/opentelematry/vinay-dev:ad-latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: service

        env:
        - name: OTEL_SERVICE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.labels['app.kubernetes.io/component']
        - name: OTEL_COLLECTOR_NAME
          value: 'opentelemetry-demo-otelcol'
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: AD_SERVICE_PORT
          value: "8080"
        - name: FLAGD_HOST
              value: 'opentelemetry-demo-flagd'
            - name: FLAGD_PORT
              value: "8013"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(OTEL_COLLECTOR_NAME):4318
            - name: OTEL_LOGS_EXPORTER
              value: otlp
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME),service.namespace=opentelemetry-demo,service.version=1.12.0
          resources:
            limits:
              memory: 300Mi
          volumeMounts:
      volumes:
