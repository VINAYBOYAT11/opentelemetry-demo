name: Product Catalog CI

on:
  pull_request:
    branches:
      - Main-2
  push:
    branches:
      - Main-2

permissions:
  contents: read

defaults:
  run:
    working-directory: src/product-catalog
#-----------------------------------------------------------------------------------------

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go  v 1.22
        uses: actions/setup-go@v2
        with:
          go-version-file: src/product-catalog/go.mod
          cache-dependency-path: src/product-catalog/go.sum
          go-version: 1.22

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o product-catalog-service .
        # select the working directory and then build main.go file

      - name: Run unit tests
        run: go test ./...
        # it will gonona run testcases deffine by the dev  and it will run all the testcases in the current directory and subdirectory
        # job 1 done

  code-quality: #job 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # golangci-lint is a fast code checker for the Go (Golang) programming language.
      #t looks for bugs, messy code, and performance issues.
      #t combines over a hundred of them into one single tool that runs incredibly fast.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: src/product-catalog

  docker-build: # job 3
    needs: build # requires the build job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # it required to set up docker buildx  to build and push multi-platform images with Docker. It is a CLI plugin that extends the docker command with the full support of the features provided by BuildKit builder toolkit.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # pull the docker image form ecr and  run the docker build it
      - name: Build Docker image
        run: docker build -t product-catalog-service:${GITHUB_SHA} -f src/product-catalog/Dockerfile .
        working-directory: .
      # ttry to build  docker imahge and run the docker image to check if it is running or not
      - name: Smoke-test Docker image
        run: |
          docker run -d --name product-catalog-service \
            -p 8088:8088 \
            product-catalog-service:${GITHUB_SHA}
          sleep 5
          docker inspect --format '{{.State.Status}}' product-catalog-service | grep -q running
          docker rm -f product-catalog-service
        working-directory: .

  publish: # docker image to ecr public #job4
    if: github.event_name == 'push'
    needs: docker-build
    runs-on: ubuntu-latest

    #AS PER THE DCCUMENAITON, THE PERMISSION IS REQUIRED TO ACCESS THE CONTENTS OF THE REPOSITORY AND TO GENERATE AN ID TOKEN FOR AUTHENTICATION.
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-west-2
      ECR_PUBLIC_ALIAS: ${{ vars.AWS_ECR_PUBLIC_ALIAS }}
      ECR_PUBLIC_REPOSITORY: ${{ vars.AWS_ECR_PUBLIC_REPOSITORY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # so i have configure d the aws credentials using oidc , github will send aws a token it vailedtes then itreturns the temporary credential , THIS WAY WE CAN AVOID STORING AWS CREDENTIALS IN GITHUB SECRETS.
      - name: configured using oidc
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # Testing aws is link correctly configured or not by running the aws sts get-caller-identity command, which returns details about the IAM identity whose credentials are used to call the operation.
      - name: test aws cli
        run: aws sts get-caller-identity

      - name: Validate ECR Public configuration
        run: |
          test -n "$ECR_PUBLIC_ALIAS"
          test -n "$ECR_PUBLIC_REPOSITORY"

      - name: Log in to ECR Public
        run: |
          : "${AWS_REGION:?AWS_REGION must be set}"
          aws ecr-public get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push Docker image to ecr public
        env:
          IMAGE: public.ecr.aws/${{ vars.AWS_ECR_PUBLIC_ALIAS }}/${{ vars.AWS_ECR_PUBLIC_REPOSITORY }}
        #public.ecr.aws/f6a5u4d3/opentelematry/vinay-dev

        run: |
          docker build -t "${IMAGE}:product-catalog-${GITHUB_RUN_ID}" -f src/product-catalog/Dockerfile .
          docker push "${IMAGE}:product-catalog-${GITHUB_RUN_ID}"
      - name: update tag in kubernates
        env:
          IMAGE: public.ecr.aws/${{ vars.AWS_ECR_PUBLIC_ALIAS }}/${{ vars.AWS_ECR_PUBLIC_REPOSITORY }}
        run: |
          sed -i "s|image: .*|image: ${IMAGE}:product-catalog-${GITHUB_RUN_ID}|" src/product-catalog/k8s/deployment.yaml
      # this is my imge public.ecr.aws/f6a5u4d3/opentelematry/vinay-dev:product-catalog-latest
      #public.ecr.aws/f6a5u4d3/opentelematry/vinay-dev:product-catalog-latest
      - name: commit and push the changes to kubernates deployment.yaml
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "vivan.boyat.9@gmail.com"
          git add src/product-catalog/k8s/deployment.yaml
          git commit -m "[CI]  Update image tag in deployment.yaml"
          git push origin Main-2
